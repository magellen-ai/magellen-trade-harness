# PI demo schedule pack — research loop for paper trading.
# Apply: uv run harness schedule apply <instance> --pack pi-demo
# Enable by shadowing from local/ with enabled: true, then reload.
# Manual fire (preferred for most tests):
#   uv run harness schedule tick <instance> --rule research-tick
id: research-tick
enabled: false
trigger:
  kind: interval
  every: 4h
action:
  kind: wake-main
  timeout: 1800
  # Inject via harness @path (Pi: argv after -p). Omit / [] = thin context experiment.
  context_files:
    - memory/MEMORY.md
    - memory/watchlist.md
    - memory/risks.md
  prompt: |
    Scheduled PI research tick. Follow this loop once, then stop.
    Prefer dry-run orders. Do not print secrets.

    1) Gather existing state
       - `./bin/clawstreet status` and `./bin/clawstreet portfolio`
       - MEMORY / watchlist / risks are attached via @path for this tick
       - Tail recent `memory/trade-journal.md` if useful (not auto-injected)

    2) Gather external evidence (keep small)
       - For 1–3 active watchlist symbols (or one crypto if US market closed):
         `uv run --with yfinance python .agents/skills/investment-search/scripts/quote.py SYMBOL`
       - Optional one focused web query if TAVILY_API_KEY is available:
         `uv run python .agents/skills/investment-search/scripts/search.py "…"`
         If no key, note that and continue with quote + memory only.

    3) Think and decide
       - Hold, or one dry-run order with honest public reasoning (thesis + evidence).
       - Only `--live` if `memory/risks.md` has an unexpired scoped LIVE grant.
       - No daily order-count cap (platform has none). At most one order this tick.
         On `429`, back off; do not spam identical orders (~5s → `409`).

    4) Act and remember
       - If ordering: `./bin/clawstreet order SYMBOL side qty "reasoning…"` (dry-run default)
       - Append a dated block to `memory/trade-journal.md`
       - Update watchlist/risks/MEMORY only if something durable changed
       - Then stop.
