# Thin harness binding: Grok Build (xai-org/grok-build, CLI `grok`).
# Auth + default model come from the host ~/.grok (membership login).
# Do not set GROK_HOME or write a workspace model override.
# Instance-local git keeps grok from walking to the parent repo AGENTS.md.
# Start via `./bin/grok` or `harness instance launch` (compat env + git init).
agent_context: AGENTS.md
skill_dirs:
  - .agents/skills
process_env_policy: minimal
process_env:
  ANYSEARCH_RUNTIME_CONFIG: "{instance_dir}/.agents/skills/anysearch/runtime.conf"
  GROK_DISABLE_AUTOUPDATER: "1"
  GROK_MEMORY: "0"
  GROK_RESPECT_GITIGNORE: "0"
  GROK_CLAUDE_SKILLS_ENABLED: "0"
  GROK_CLAUDE_RULES_ENABLED: "0"
  GROK_CLAUDE_AGENTS_ENABLED: "0"
  GROK_CLAUDE_MCPS_ENABLED: "0"
  GROK_CLAUDE_HOOKS_ENABLED: "0"
  GROK_CURSOR_SKILLS_ENABLED: "0"
  GROK_CURSOR_RULES_ENABLED: "0"
  GROK_CURSOR_AGENTS_ENABLED: "0"
  GROK_CURSOR_MCPS_ENABLED: "0"
  GROK_CURSOR_HOOKS_ENABLED: "0"
materialize:
  - src: bin/grok-exec.sh
    dest: bin/grok-exec
    mode: 0o755
  - src: bin/grok.sh
    dest: bin/grok
    mode: 0o755
launch:
  argv:
    - ./bin/grok-exec
    - --always-approve
  sync_before: true
# Grok understands @path inside the prompt text.
schedule_actions:
  wake-main:
    cwd: instance
    context_files_mode: prompt_prefix
    before:
      - argv:
          - uv
          - run
          - harness
          - instance
          - sync-settings
          - "{instance}"
    argv:
      - ./bin/grok-exec
      - -p
      - "{prompt}"
      - --always-approve
      - --output-format
      - plain
