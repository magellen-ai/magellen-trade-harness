skills:
- path: skills/paper-ashare-trade
- path: skills/investment-search
- npx:
    package: HiThink-Tech/Financial-API
    skill: hithink-finance
trade:
  default_dry_run: true
  default_account: default
schedule:
  actions:
    wake-main:
      before:
      - argv:
        - uv
        - run
        - harness
        - instance
        - sync-settings
        - '{instance}'
env:
  AIPROXY_API_KEY: $AIPROXY_API_KEY
  HITHINK_FINANCE_API_KEY: $HITHINK_FINANCE_API_KEY
  TAVILY_API_KEY: $TAVILY_API_KEY
agent: ashare-pi-paper
tools:
- cli: paper-ashare
- cli: fuyao
- cli: schedule
  enable:
  - check
  - reload
  - status
  - create
  - list
  - cancel
