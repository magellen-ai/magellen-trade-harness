# A-share PI paper schedule pack — research loop.
# Apply: uv run harness schedule apply <instance> (from profile schedule/)
# Enable by shadowing from local/ with enabled: true, then reload.
# Manual fire (preferred):
#   uv run harness schedule tick <instance> --rule research-tick
id: research-tick
enabled: false
trigger:
  kind: interval
  every: 4h
action:
  kind: wake-main
  timeout: 1800
  # Inject via harness @path (Pi: argv after -p). Omit / [] = thin context experiment.
  context_files:
    - memory/MEMORY.md
    - memory/watchlist.md
    - memory/risks.md
  prompt: |
    Scheduled A-share paper research tick. Follow this loop once, then stop.
    Prefer dry-run. Memory files above are attached via @path — use them.

    1) Gather existing state
       - `./bin/paper-ashare status` and `./bin/paper-ashare portfolio`
       - Use attached MEMORY / watchlist / risks (@path)
       - Tail recent `memory/trade-journal.md` only if useful

    2) Gather external evidence (keep small)
       - For 1–3 active watchlist symbols: use the `hithink-finance` skill.
         Optional: `./bin/fuyao quote 600519.SH`.
       - Optional one focused web query if TAVILY_API_KEY is available:
         `uv run python .agents/skills/investment-search/scripts/search.py "…"`
         If no key, continue with hithink-finance + memory only.

    3) Think and decide
       - Hold, or one dry-run order with honest public reasoning (thesis + evidence).
       - Only `--live` if attached `risks.md` has an unexpired scoped LIVE grant.
       - Qty multiple of 100; buy|sell only; respect T+1.
       - At most one order this tick.

    4) Act and remember
       - If ordering: `./bin/paper-ashare order SYMBOL buy|sell QTY "reasoning…"` (dry-run default)
       - Append a dated block to `memory/trade-journal.md`
       - Update watchlist/risks/MEMORY only if something durable changed
       - Then stop.
