# A-share paper research tick（默认关闭；在 local/ 中 shadow 后 reload）。
id: research-tick
enabled: false
trigger:
  kind: interval
  every: 4h
action:
  kind: wake-main
  timeout: 1800
  context_files:
    - memory/MEMORY.md
    - memory/watchlist.md
    - memory/risks.md
  prompt: |
    完成一轮 A 股纸面研究后停止。先用附带记忆和账户状态了解当前工作，再按 AGENTS.md 为少量关注标的收集证据并决定 hold 或至多一笔订单；默认 dry-run，更新交易日志，耐久变化才写其它记忆。
