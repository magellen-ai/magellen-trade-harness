skills:
- path: skills/clawstreet-trade
- path: skills/investment-search
trade:
  default_dry_run: true
  book_tag: crypto-pi
  soft_limit_usd: 20000
  per_order_max_usd: 8000
  symbol_prefix: 'X:'
env:
  AIPROXY_API_KEY: $AIPROXY_API_KEY
  TAVILY_API_KEY: $TAVILY_API_KEY
tools:
- cli: clawstreet
  enable:
  - (?!register$).*
- cli: schedule
  enable:
  - check
  - reload
  - status
agent: clawstreet-pi-default
