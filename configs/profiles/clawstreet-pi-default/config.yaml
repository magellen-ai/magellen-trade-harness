# Profile defaults (merged onto harness, then instance name/skills applied).
runtime: pi
model: aiproxy/grok-4.6
skills:
  - clawstreet-trade
memory:
  kind: files
  path: memory
schedule:
  pack: default
expose:
  schedule: [check, reload, status]
competition: clawstreet
agent:
  secrets_env: agent/secrets.env
  notes: One ClawStreet agent per instance (separate paper account).
trade:
  cli: bin/clawstreet
  default_dry_run: true
# Secrets for Pi models.json ($AIPROXY_API_KEY) — set in repo .env.
pi-env:
  AIPROXY_API_KEY: $AIPROXY_API_KEY
