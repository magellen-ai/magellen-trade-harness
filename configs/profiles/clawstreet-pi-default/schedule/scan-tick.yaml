# Always-on crypto scan tick（默认关闭；在 local/ 中 shadow 后 reload）。
id: scan-tick
enabled: false
trigger:
  kind: interval
  every: 1h
condition:
  kind: script
  timeout: 180
  run: >
    uv run --with yfinance python
    scripts/macd_scan.py
    X:BTCUSD X:ETHUSD X:SOLUSD
action:
  kind: wake-main
  timeout: 1800
  context_files:
    - memory/world_state.md
    - memory/working_set.md
    - memory/risks.md
  prompt: |
    完成一轮加密扫描后停止。以下 condition 输出是候选信号：
    {condition_output}
    按 AGENTS.md 验证状态和 thesis，只在证据支持且额度允许时做至多一笔 dry-run 订单；否则 hold，并追加交易日志。
