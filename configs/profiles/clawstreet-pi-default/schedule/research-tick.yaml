# Always-on crypto research tick（默认关闭；在 local/ 中 shadow 后 reload）。
id: research-tick
enabled: false
trigger:
  kind: interval
  every: 4h
action:
  kind: wake-main
  timeout: 1800
  context_files:
    - memory/world_state.md
    - memory/working_set.md
    - memory/risks.md
    - memory/MEMORY.md
  prompt: |
    完成一轮加密研究后停止。使用附带的状态和 `./bin/clawstreet` 按 AGENTS.md 检查 thesis、风险与必要行情，决定 hold 或至多一笔 dry-run 订单，并追加交易日志。
