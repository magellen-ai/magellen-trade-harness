# Always-on crypto risk tick（默认关闭；在 local/ 中 shadow 后 reload）。
id: risk-tick
enabled: false
trigger:
  kind: cron
  expr: "0 9,21 * * *"
action:
  kind: wake-main
  timeout: 1200
  context_files:
    - memory/world_state.md
    - memory/working_set.md
    - memory/risks.md
  prompt: |
    完成一轮加密风险核对后停止。比较附带状态与账户、检查 soft limit 和 thesis；本轮只能对本书做 reduce-only dry-run，发现 other / historical 漂移只记录告警。
