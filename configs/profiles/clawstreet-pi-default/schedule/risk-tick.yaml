# Always-on crypto risk / reconcile tick (reduce-only).
id: risk-tick
enabled: false
trigger:
  kind: cron
  expr: "0 9,21 * * *"
action:
  kind: wake-main
  timeout: 1200
  context_files:
    - memory/world_state.md
    - memory/working_set.md
    - memory/risks.md
  prompt: |
    Scheduled crypto RISK tick. REDUCE-ONLY. Follow once, then stop.

    1) Compare attached world_state vs `./bin/clawstreet portfolio` and `./bin/clawstreet exposure --json`.
    2) Check soft-limit usage and thesis invalidation files under `memory/thesis/`.
    3) If a position drift appears that is NOT this book (account other / historical): ALERT in journal only — do not trade it.
    4) You may only place sell/cover (reduce) dry-run orders for this book's `X:`* risk; no new buys/shorts this tick.
       Only `--live` with an unexpired LIVE grant scoped to reduce.
    5) Append journal entry (action/signals/reasoning/invalidation/size_hint) even if hold.
    6) Stop.
