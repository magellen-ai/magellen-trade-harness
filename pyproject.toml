[project]
name = "magellen-trade-harness"
version = "0.1.0"
description = "Harness runtime experiments + competition paper-trade adapters"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.scripts]
clawstreet = "competitions.clawstreet.cli:main"
harness = "runtime.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
